<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>mini-app AFACTS</title>
    <analytics></analytics>
  </head>

  <body class="index">
    <div id="logo">
      <img src="/public/images/logo.svg" alt="a_facts logo" />
    </div>

    <!-- <video autoplay muted loop playsinline id="bg-video">
      <source src="/public/video/a_facts_bg_video.mp4" type="video/mp4" />
    </video> -->
    <div class="coming_soon">
      <h1>
        Медиа-сервис<br>
        о&nbsp;визуальных эффектах<br>
        в&nbsp;киноиндустрии
      </h1>

      <p>
        Уникальный проект для&nbsp;тех, кто&nbsp;хочет не&nbsp;просто смотреть кино,
        а&nbsp;понимать, как&nbsp;создается его магия.
      </p>

    <form 
        class="W_LoginSection"
        action="http://localhost:3000/api/v1/sign_in.json"
        accept-charset="UTF-8"
        method="post"
        class="hidden"
        id="login_form"
        >
      
      <div class="M_LoginInputs">
        <input 
        class="A_LoginEmail"
        type="email"
        placeholder="e-mail"
        name="user[email]"
        id="user_email" />
        <input
        class="A_LoginEmail"
        type="password"
        placeholder="Ваш пароль"
        name="user[password]"
        id="password" />
      </div>
      <input
        class="A_LoginSubmit"
        type="submit"
        name="commit"
        value="Войти"
        data-disable-with="Войти"
      />
    </form>
    
    <footer class="W_Subscribe">
      <section class="M_FooterInput"><p class="A_FooterText">Подпишитесь, чтобы не пропустить релиз!</p>
      <form 
      action="http://localhost:3000/api/v1/subscribers.json"
      accept-charset="UTF-8"
      method="post"
      id="subscription_form"
    >
      <input class="A_SubscribeEmail" type="email" placeholder="e-mail" name="subscriber[email]" id="subscriber_email" />

      <input
        class="A_SubscribeSubmit"
        type="submit"
        name="commit"
        value="Подписаться"
        data-disable-with="Create Subscription"
      />
    </form></section>
      
    </footer>
  </body>
</html>

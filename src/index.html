<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>mini-app AFACTS</title>
    <analytics></analytics>
  </head>

  <body class="index">
    <div id="logo">
      <img src="/public/images/logo.svg" alt="a_facts logo" />
    </div>

    <div class="coming_soon">
      <h1>
        Медиа-сервис<br />
        о&nbsp;визуальных эффектах<br />
        в&nbsp;киноиндустрии
      </h1>

      <p>
        Уникальный проект для&nbsp;тех, кто&nbsp;хочет не&nbsp;просто смотреть
        кино, а&nbsp;понимать, как&nbsp;создается его магия.
      </p>
    </div>
    <!-- log_in -->
    <form
      class="W_LoginSection"
      action="http://localhost:3000/api/v1/sign_in.json"
      accept-charset="UTF-8"
      method="post"
      id="login_form"
    >
      <div class="M_LoginInputs">
        <input
          class="A_LoginEmail"
          type="email"
          placeholder="e-mail"
          name="user[email]"
          id="user_email"
        />
        <input
          class="A_LoginEmail"
          type="password"
          placeholder="Ваш пароль"
          name="user[password]"
          id="password"
        />
      </div>
      <div class="M_AuthSwitch">
        <button type="button" class="A_AuthTab" id="show_signup">
          Зарегистрироваться
        </button>
        <input
          class="A_LoginSubmit"
          type="submit"
          name="commit"
          value="Войти"
          data-disable-with="Войти"
        />
      </div>
    </form>
    <!-- sign_up -->
    <form
      class="W_LoginSection hidden"
      action="http://localhost:3000/api/v1/sign_up.json"
      accept-charset="UTF-8"
      method="post"
      id="signup_form"
    >
      <div class="M_LoginInputs">
        <input
          class="A_LoginEmail"
          type="email"
          placeholder="e-mail"
          name="user[email]"
          id="user_email"
        />
        <input
          class="A_LoginEmail"
          type="password"
          placeholder="Придумайте пароль"
          name="user[password]"
          id="password"
        />
        <input
          class="A_LoginEmail"
          type="password"
          placeholder="Повторите пароль"
          name="user[password_confirmation]"
          id="password_confirmation"
        />
      </div>
      <div class="M_AuthSwitch">
        <button type="button" class="A_AuthTab" id="show_login">Войти</button>

        <input
          class="A_LoginSubmit"
          type="submit"
          name="commit"
          value="Зарегистрироваться"
          data-disable-with="Зарегистрироваться"
        />
      </div>
    </form>
    <section class="bg-marquee" aria-hidden="true">
      <div class="bg-col bg-col--1">
        <div class="bg-track">
          <div class="bg-tile bg-tile-1"></div>
          <div class="bg-tile bg-tile-2"></div>
          <div class="bg-tile bg-tile-3"></div>
          <div class="bg-tile bg-tile-4"></div>
          <div class="bg-tile bg-tile-5"></div>
          <div class="bg-tile bg-tile-6"></div>
          <div class="bg-tile bg-tile-7"></div>
          <div class="bg-tile bg-tile-8"></div>
          <div class="bg-tile bg-tile-9"></div>
          <div class="bg-tile bg-tile-10"></div>

          <!-- дубликат для бесконечного скролла -->

          <div class="bg-tile bg-tile-1"></div>
          <div class="bg-tile bg-tile-2"></div>
          <div class="bg-tile bg-tile-3"></div>
          <div class="bg-tile bg-tile-4"></div>
          <div class="bg-tile bg-tile-5"></div>
          <div class="bg-tile bg-tile-6"></div>
          <div class="bg-tile bg-tile-7"></div>
          <div class="bg-tile bg-tile-8"></div>
          <div class="bg-tile bg-tile-9"></div>
          <div class="bg-tile bg-tile-10"></div>
        </div>
      </div>

      <div class="bg-col bg-col--2">
        <div class="bg-track">
          <div class="bg-tile bg-tile-11"></div>
          <div class="bg-tile bg-tile-12"></div>
          <div class="bg-tile bg-tile-13"></div>
          <div class="bg-tile bg-tile-14"></div>
          <div class="bg-tile bg-tile-15"></div>
          <div class="bg-tile bg-tile-16"></div>
          <div class="bg-tile bg-tile-17"></div>
          <div class="bg-tile bg-tile-18"></div>
          <div class="bg-tile bg-tile-19"></div>
          <div class="bg-tile bg-tile-20"></div>

          <!-- дубликат для бесконечного скролла -->

          <div class="bg-tile bg-tile-11"></div>
          <div class="bg-tile bg-tile-12"></div>
          <div class="bg-tile bg-tile-13"></div>
          <div class="bg-tile bg-tile-14"></div>
          <div class="bg-tile bg-tile-15"></div>
          <div class="bg-tile bg-tile-16"></div>
          <div class="bg-tile bg-tile-17"></div>
          <div class="bg-tile bg-tile-18"></div>
          <div class="bg-tile bg-tile-19"></div>
          <div class="bg-tile bg-tile-20"></div>
        </div>
      </div>

      <div class="bg-col bg-col--3">
        <div class="bg-track">
          <div class="bg-tile bg-tile-21"></div>
          <div class="bg-tile bg-tile-22"></div>
          <div class="bg-tile bg-tile-23"></div>
          <div class="bg-tile bg-tile-24"></div>
          <div class="bg-tile bg-tile-25"></div>
          <div class="bg-tile bg-tile-26"></div>
          <div class="bg-tile bg-tile-27"></div>
          <div class="bg-tile bg-tile-28"></div>
          <div class="bg-tile bg-tile-29"></div>
          <div class="bg-tile bg-tile-30"></div>

          <!-- дубликат для бесконечного скролла -->

          <div class="bg-tile bg-tile-21"></div>
          <div class="bg-tile bg-tile-22"></div>
          <div class="bg-tile bg-tile-23"></div>
          <div class="bg-tile bg-tile-24"></div>
          <div class="bg-tile bg-tile-25"></div>
          <div class="bg-tile bg-tile-26"></div>
          <div class="bg-tile bg-tile-27"></div>
          <div class="bg-tile bg-tile-28"></div>
          <div class="bg-tile bg-tile-29"></div>
          <div class="bg-tile bg-tile-30"></div>
        </div>
      </div>
    </section>
    <footer class="W_Subscribe">
      <section class="M_FooterInput">
        <p class="A_FooterText">Подпишитесь, чтобы не пропустить релиз!</p>
        <form
          action="http://localhost:3000/api/v1/subscribers.json"
          accept-charset="UTF-8"
          method="post"
          id="subscription_form"
        >
          <input
            class="A_SubscribeEmail"
            type="email"
            placeholder="e-mail"
            name="subscriber[email]"
            id="subscriber_email"
          />

          <input
            class="A_SubscribeSubmit"
            type="submit"
            name="commit"
            value="Подписаться"
            data-disable-with="Create Subscription"
          />
        </form>
      </section>
    </footer>
  </body>
</html>
